# CityWalk 后端远端部署配置
# 用法: docker compose -f docker-compose.deploy.yml up -d

services:
  # MongoDB - 路线数据存储
  mongodb:
    image: mongo:8
    container_name: citywalk-mongo
    restart: unless-stopped
    # 不暴露端口到宿主机，仅容器内网络访问
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: citywalk
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - citywalk-net

  # FalkorDB - 知识图谱存储
  falkordb:
    image: falkordb/falkordb:latest
    container_name: citywalk-falkordb
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - falkordb_data:/data
    networks:
      - citywalk-net

  # CityWalk Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citywalk-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=citywalk
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=${FALKORDB_GRAPH_NAME:-citywalk_kg}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - AMAP_API_KEY_BACKEND=${AMAP_API_KEY_BACKEND:-}
      - AMAP_API_KEY=${AMAP_API_KEY:-}
      - AMAP_SECURITY_KEY=${AMAP_SECURITY_KEY:-}
      - DEBUG=false
    env_file:
      - .env
    networks:
      - citywalk-net

volumes:
  mongodb_data:
  falkordb_data:

networks:
  citywalk-net:
    driver: bridge
