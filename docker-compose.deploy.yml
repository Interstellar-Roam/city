# CityWalk 后端远端部署配置
# 用法: docker compose -f docker-compose.deploy.yml up -d

services:
  # MongoDB - 用户、认证、会话和偏好
  mongodb:
    image: mongo:8
    container_name: citywalk-mongo
    restart: unless-stopped
    # 不暴露端口到宿主机，仅容器内网络访问
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: citywalk
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - citywalk-net

  # PostgreSQL/PostGIS - 地点、路线和空间查询
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.5}
    platform: ${POSTGIS_PLATFORM:-linux/amd64}
    container_name: citywalk-postgis
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citywalk}
      POSTGRES_USER: ${POSTGRES_USER:-citywalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citywalk} -d ${POSTGRES_DB:-citywalk}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - citywalk-net

  # FalkorDB - 知识图谱存储
  falkordb:
    image: falkordb/falkordb:latest
    container_name: citywalk-falkordb
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - falkordb_data:/data
    networks:
      - citywalk-net

  # CityWalk Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citywalk-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=citywalk
      - POSTGRES_DSN=postgresql://${POSTGRES_USER:-citywalk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-citywalk}
      - GEO_AUTO_MIGRATE=true
      - GEO_SEED_DEMO_PLACES=${GEO_SEED_DEMO_PLACES:-false}
      - ROUTING_PROVIDER=${ROUTING_PROVIDER:-amap}
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=${FALKORDB_GRAPH_NAME:-citywalk_kg}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - RECOMMENDATION_AGENT_ENABLED=${RECOMMENDATION_AGENT_ENABLED:-true}
      - RECOMMENDATION_AGENT_MAX_ITERATIONS=${RECOMMENDATION_AGENT_MAX_ITERATIONS:-4}
      - RECOMMENDATION_AGENT_MAX_SEARCHES=${RECOMMENDATION_AGENT_MAX_SEARCHES:-3}
      - RECOMMENDATION_AGENT_TIMEOUT_SECONDS=${RECOMMENDATION_AGENT_TIMEOUT_SECONDS:-20}
      - AMAP_API_KEY_BACKEND=${AMAP_API_KEY_BACKEND:-}
      - AMAP_API_KEY=${AMAP_API_KEY:-}
      - AMAP_SECURITY_KEY=${AMAP_SECURITY_KEY:-}
      - DEBUG=false
    networks:
      - citywalk-net

volumes:
  mongodb_data:
  falkordb_data:
  postgres_data:

networks:
  citywalk-net:
    driver: bridge
